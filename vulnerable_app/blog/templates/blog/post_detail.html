<!DOCTYPE html>
<html>
<head>
    <title>{{ post.title }}</title>
</head>
<body>
    <h1>{{ post.title }}</h1>
    <p>{{ post.content }}</p>

    <h2>Comments</h2>
    <div class="comments">
        {% for comment in post.comments.all %}
            <div class="comment">
                <strong>{{ comment.author.username }}:</strong>
                {{ comment.text }}
            </div>
        {% empty %}
            <p>No comments yet.</p>
        {% endfor %}
    </div>
</body>
</html>
